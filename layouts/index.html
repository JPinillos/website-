{{ define "main" }}
<section class="hero-banner">
  <div class="hero-banner-content">
    <h1 class="hero-name">Juliana Pinillos</h1>
  </div>
</section>

<section class="about-section">
  <div class="about-content">
    <div class="about-photo">
      <img src="{{ .Site.Params.profileImage }}" alt="Photo of {{ .Site.Params.author }}">
    </div>
    <div class="about-text">
      {{ .Content }}
    </div>
  </div>
</section>
{{ end }}
