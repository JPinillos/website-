<header class="site-header">
  <div class="container header-inner">
    <nav class="site-nav">
      {{ range $i, $e := .Site.Menus.main }}
        {{ if $i }}<span class="nav-sep">&middot;</span>{{ end }}
        <a href="{{ .URL }}" class="nav-link{{ if $.IsMenuCurrent "main" . }} active{{ end }}"{{ if hasPrefix .URL "http" }} target="_blank" rel="noopener"{{ end }}>{{ .Name }}</a>
      {{ end }}
    </nav>
    <button class="nav-toggle" aria-label="Toggle navigation">
      <span></span><span></span><span></span>
    </button>
  </div>
</header>
